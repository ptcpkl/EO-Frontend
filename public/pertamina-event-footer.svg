<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff5ff"/>
      <stop offset="0.58" stop-color="#c8ebfb"/>
      <stop offset="1" stop-color="#bde4f7"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05396d"/>
      <stop offset="1" stop-color="#002f60"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00b6a6"/>
      <stop offset="1" stop-color="#0095aa"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc62d"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#1599d1" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1600" height="760" fill="url(#sky)"/>
